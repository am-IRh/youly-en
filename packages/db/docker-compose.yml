name: youly-en

services:
  postgres:
    image: postgres
    container_name: youly-en-postgres
    environment:
      POSTGRES_DB: youly-en
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - youly-en_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  youly-en_postgres_data:
